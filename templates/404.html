{% extends 'base.html' %}
{% block title %}404 — {{ t.misc.not_found }}{% endblock %}
{% block content %}
<section class="notfound" style="min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center">
  <div class="container">
    <h1 style="font-size:clamp(4rem,14vw,9rem);line-height:1;margin:0" class="accent">404</h1>
    <h2>{{ t.misc.not_found_heading }}</h2>
    <p style="opacity:.75">{{ t.misc.not_found_text }}</p>
    <a class="btn btn-primary" href="{% url 'portfolio:home' %}">{{ t.misc.not_found_button }}</a>
  </div>
</section>
{% endblock %}
